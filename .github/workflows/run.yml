# Daily pipeline: sync filings, price buys, alert, render dashboard.
name: insider

on:
  schedule:
    - cron: "0 13 * * *"  # daily, 13:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt pytest

      - run: python -m pytest tests/

      # --no-notify until TELEGRAM_TOKEN/TELEGRAM_CHAT_ID secrets are set - without it,
      # the first real alert 404s against Telegram and kills the run before it commits.
      # Drop the flag once Telegram is configured.
      - run: python -m insider.run --no-notify
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit updated state
        run: |
          git config user.name "insider-bot"
          git config user.email "actions@users.noreply.github.com"
          git add trades.db docs/index.html
          git diff --cached --quiet || git commit -m "update trades"
          git push
