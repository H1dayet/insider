name: Refresh Northstar research

on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: northstar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m northstar.pipeline
        env:
          SEC_USER_AGENT: "Northstar research ${{ github.repository_owner }}@users.noreply.github.com"

      - name: Commit refreshed research data
        run: |
          git config user.name "northstar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json data/paper-portfolio.json data/universe.json data/experiments.json
          git diff --cached --quiet || git commit -m "refresh Northstar research data"
          git push

